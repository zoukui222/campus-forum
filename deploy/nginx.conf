# 校园论坛系统 —— Nginx 生产配置（容器内路径 /etc/nginx/conf.d/default.conf）
#
# 说明：本项目前端路由使用 createWebHistory()（history 模式），
# 因此必须配置 SPA 回退，否则直接访问/刷新 /post/1 这类子路径会返回 404。

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;      # 允许上传较大的图片

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带内容哈希的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端接口：转发到 backend 容器，路径原样保留（后端接口前缀就是 /api）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传文件的静态访问：后端把 /file/** 映射到磁盘目录
    location /file/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 接口文档（Knife4j）
    location /doc.html {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /webjars/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /v3/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA 回退：先找静态文件，找不到交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
