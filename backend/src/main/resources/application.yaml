# 敏感配置（数据库 / Redis / 文件路径）不写入版本库：
#   本地开发 → 真实值放在 application-local.yaml（已加入 .gitignore），启动时由下面的 profile 自动加载
#   部署环境 → 通过环境变量 DB_USERNAME / DB_PASSWORD / DB_HOST / REDIS_PASSWORD 等注入
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: forum
  data:
    redis:
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      host: ${REDIS_HOST:localhost}
      database: ${REDIS_DATABASE:0}

  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/campus_forum?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai

# JWT 签名密钥（原先硬编码在代码中，现改为配置注入；生产环境通过环境变量 JWT_SECRET 覆盖）
jwt:
  secret: ${JWT_SECRET:CampusForumDevSecretChangeMe2025!!!}

knife4j:
  enable: true
  setting:
    language: zh_cn

# 文件上传相关配置
service:
  download:
    # 文件上传与访问路径（本地真实路径放在 application-local.yaml，或由环境变量注入）
    address: ${FILE_UPLOAD_PATH:./file/}
  ipAddr: ${SERVICE_IP:http://localhost}

server:
  port: 8080
