# 校园论坛系统 —— 一键部署编排
#
# 使用前：
#   1) cp deploy/.env.example .env 并填写真实密码与公网地址
#   2) 在 frontend 目录执行 npm run build 生成 dist（Nginx 直接托管该目录）
#   3) docker compose up -d --build
#
# 对外只暴露 Nginx 的 8080 端口（后端返回的图片 URL 中端口取自 server.port=8080，
# 因此对外端口必须与之保持一致，否则上传的图片地址会指向不可访问的端口）。

services:
  mysql:
    image: mysql:8.0
    container_name: forum-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: campus_forum
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 数据持久化：容器删除后数据仍在
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空（首次启动）时自动执行 sql 文件初始化表结构与演示数据
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [forum-net]

  backend:
    build: ./backend
    container_name: forum-backend
    restart: unless-stopped
    environment:
      # 数据库连接（与下方 datasource 配置中的占位符对应）
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 对外可访问的地址（不含端口）：后端会用 "SERVICE_IP:server.port" 拼图片访问地址
      SERVICE_IP: ${SERVICE_IP:?请在 .env 中设置 SERVICE_IP，例如 http://123.45.67.89}
      # 上传文件的落盘目录（对应 volume）
      FILE_UPLOAD_PATH: /app/file/
      TZ: Asia/Shanghai
    volumes:
      # 上传的图片持久化，避免容器重建后图片丢失
      - upload-data:/app/file
    depends_on:
      mysql:
        condition: service_healthy
    networks: [forum-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: forum-nginx
    restart: unless-stopped
    ports:
      # 对外端口 = 后端 server.port，二者必须一致
      - "8080:8080"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks: [forum-net]

volumes:
  mysql-data:
  upload-data:

networks:
  forum-net:
    driver: bridge
